<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <nav>
        <h1>Home</h1>
        <div class="cart" onclick="toggleCart()">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count">0</span>
        </div>
    </nav>


    <main>
        <div class="title-text">
            <h2>MUSICAL KEYBOARD</h2>
            <input class="input-search" type="text" id="searchBar" placeholder="Search products..." onkeyup="filterProducts()">
        </div>

        <div class="grid_container" id="productGrid"></div>
    </main>

    <!--Cart pane-->
    <div class="cart-pane" id="cart-pane">
        <h2>Cart</h2>
        <ul id="cart"></ul>
        <h3>Total: GH₵<span id="total">0</span></h3>
        <button class="removeAll" onclick="removeAll()">Remove All</button>
    </div>

    <!--Pop up-->
    <div class="popup" id="popup"> 
        <div class="checkmark">✔</div> 
        <p id="popupMessage"></p> 
        <button onclick="closePopup()">Close</button> 
    </div>

    <!-- Modal --> 
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal()"></div> 
    <div class="modal" id="product-modal"> 
        <div class="modal-content"> 
            <div id="modal-images" class="slider">
                <button class="prev" onclick="changeSlide(-1)">&#10094;</button> 
                <div class="slides-container"></div> 
                <button class="next" onclick="changeSlide(1)">&#10095;</button>
            </div> 
            <h2 id="modal-title"></h2> 
            <p id="modal-description"></p> 
            <h4 id="modal-price"></h4> 
            <div class="modal-buttons">
                <button class="modal-add-to-cart" onclick="addToCart()" id="modal-add-to-cart">Add to Cart</button>
                <button class="modal-close" onclick="closeModal()">Close</button> 
            </div>
        </div> 
    </div>


    <script type="module" src="/js/index.js"></script>
</body>
</html>
